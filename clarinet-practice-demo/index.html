<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1530" />
  <title>악기 연습</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-glow"></div>

  <header class="topbar">
    <h1 id="appTitleText">🎵 악기 연습</h1>
    <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙️</button>
  </header>

  <main id="app">
    <!-- 언어 선택 화면 (최초 1회) -->
    <section id="screen-language" class="screen">
      <div class="lang-emoji">🌐</div>
      <p class="lead">언어를 선택하세요 · Choose your language · 请选择语言</p>
      <button id="langKoBtn" class="big-button">한국어</button>
      <button id="langEnBtn" class="big-button">English</button>
      <button id="langZhBtn" class="big-button">中文</button>
    </section>

    <!-- 홈 화면 -->
    <section id="screen-home" class="screen">
      <p id="appSubtitleText" class="subtitle"></p>

      <div class="seg session-seg">
        <button id="sessionPracticeBtn" type="button" class="seg-btn"></button>
        <button id="sessionTestBtn" type="button" class="seg-btn"></button>
      </div>
      <p id="sessionModeDescText" class="hint session-desc"></p>

      <div class="option-card option-card--accent" id="randomPracticeBtn">
        <div class="option-icon">🎲</div>
        <div class="option-copy">
          <div class="option-title" id="cardRandomTitleText"></div>
          <div class="option-desc" id="cardRandomDescText"></div>
        </div>
        <div class="option-arrow">›</div>
      </div>

      <div class="option-card" id="freePlayBtn">
        <div class="option-icon">🎹</div>
        <div class="option-copy">
          <div class="option-title" id="cardFreeTitleText"></div>
          <div class="option-desc" id="cardFreeDescText"></div>
        </div>
        <div class="option-arrow">›</div>
      </div>
    </section>

    <!-- 음표 목록 검토 -->
    <section id="screen-review" class="screen">
      <p id="reviewLeadText" class="lead"></p>
      <div id="noteList" class="note-list"></div>
      <div id="notePalette" class="note-palette"></div>
      <div class="button-row">
        <button id="reviewCancelBtn" class="secondary-button"></button>
        <button id="startPracticeBtn" class="big-button"></button>
      </div>
    </section>

    <!-- 연습 화면 -->
    <section id="screen-practice" class="screen">
      <div id="progressDots" class="progress-dots"></div>
      <div class="target-note" id="targetNoteCard">
        <div class="target-note-inner">
          <span id="targetNoteKorean">도</span>
          <span id="targetNoteOctave" class="target-octave"></span>
        </div>
      </div>
      <p id="practiceStatus" class="status"></p>
      <p id="fingeringHintText" class="fingering-hint" hidden></p>
      <div class="mic-meter"><div id="micLevelBar"></div></div>
      <div id="keyModeSwitch" class="seg" hidden>
        <button id="keyModeToggleBtn" type="button" class="seg-btn"></button>
        <button id="keyModeHoldBtn" type="button" class="seg-btn"></button>
        <button id="boardBtn" type="button" class="seg-btn seg-btn--board" hidden></button>
      </div>
      <p id="keyboardHintText" class="hint" hidden></p>
      <div id="camPanel" class="cam-panel" hidden></div>
      <div id="kbLayout" class="kb-layout" hidden>
        <div id="clarinetWrap" class="clarinet-wrap"></div>
        <div id="keyPanel" class="key-panel"></div>
      </div>
      <div class="button-row">
        <button id="skipNoteBtn" class="secondary-button"></button>
        <button id="freeListBtn" class="secondary-button" hidden></button>
        <button id="stopPracticeBtn" class="secondary-button"></button>
      </div>
    </section>

    <!-- 결과 화면 -->
    <section id="screen-results" class="screen">
      <h2 id="resultsTitleText"></h2>
      <p id="resultsSubtitleText" class="subtitle"></p>

      <div class="accuracy-ring-wrap">
        <svg class="accuracy-ring" viewBox="0 0 140 140">
          <circle class="accuracy-ring-track" cx="70" cy="70" r="60" />
          <circle id="accuracyRingFill" class="accuracy-ring-fill" cx="70" cy="70" r="60" />
        </svg>
        <div class="accuracy-ring-label">
          <span id="resultAccuracy">0%</span>
          <label id="resultAccuracyLabelText"></label>
        </div>
      </div>

      <div class="results-grid">
        <div class="result-card correct">
          <span id="resultCorrect">0</span>
          <label id="resultCorrectLabelText"></label>
        </div>
        <div class="result-card incorrect">
          <span id="resultIncorrect">0</span>
          <label id="resultIncorrectLabelText"></label>
        </div>
      </div>
      <div class="button-row">
        <button id="retryPracticeBtn" class="big-button"></button>
        <button id="newScoreBtn" class="secondary-button"></button>
      </div>
    </section>
  </main>

  <!-- 설정 화면 -->
  <div id="settingsOverlay" class="overlay">
    <div class="settings-panel">
      <h2 id="settingsTitleText"></h2>
      <label>
        <span id="settingsLanguageLabelText"></span>
        <select id="languageSelect">
          <option value="ko">한국어</option>
          <option value="en">English</option>
          <option value="zh">中文</option>
        </select>
      </label>
      <label>
        <span id="settingsInstrumentLabelText"></span>
        <select id="instrumentSelect"></select>
      </label>
      <label>
        <span id="settingsInputModeLabelText"></span>
        <select id="inputModeSelect"></select>
      </label>
      <label>
        <span id="settingsKeyModeLabelText"></span>
        <select id="keyModeSelect"></select>
      </label>
      <div class="button-row">
        <button id="settingsSaveBtn" class="big-button"></button>
        <button id="settingsCloseBtn" class="secondary-button"></button>
      </div>
    </div>
  </div>

  <!-- 음표 편집 팝업 -->
  <div id="noteEditorOverlay" class="overlay">
    <div class="settings-panel">
      <h2 id="noteEditorTitleText"></h2>
      <div id="noteEditorPitches" class="pitch-grid"></div>
      <label>
        <span id="octaveLabelText"></span>
        <div class="octave-row">
          <button id="octaveDownBtn" class="secondary-button">−</button>
          <span id="octaveValue">4</span>
          <button id="octaveUpBtn" class="secondary-button">+</button>
        </div>
      </label>
      <div class="button-row">
        <button id="noteDeleteBtn" class="secondary-button"></button>
        <button id="noteEditorCloseBtn" class="big-button"></button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
